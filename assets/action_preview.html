<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>宠物动作 · 合图试验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#34443b;font:15px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:40px 24px}h1{font-size:29px;margin:0}p{margin:8px 0 22px;color:#687469}.eyebrow{font-size:12px;letter-spacing:2px;color:#7c8e74}.layout{display:grid;grid-template-columns:408px 1fr;gap:28px;margin-top:28px}.panel{background:#fffcf5;border:1px solid #dddccb;border-radius:22px;padding:23px;box-shadow:0 5px 22px #455d4610}.stage{width:360px;height:360px;position:relative;background:#f0ead8;border-radius:16px;overflow:hidden}.stage.checker{background-color:#eee;background-image:conic-gradient(#ddd 25%,#f9f9f9 0 50%,#ddd 0 75%,#f9f9f9 0);background-size:24px 24px}.stage.dark{background:#293a35}canvas{display:block;width:360px;height:360px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button,select{font:inherit;padding:8px 13px;border:1px solid #c9d0c1;border-radius:10px;color:#34443b;background:#fafbf5;cursor:pointer}button:hover{background:#e5ecdf}button:disabled{opacity:.42;cursor:not-allowed}.primary,button.active{background:#58735e;color:white;border-color:#58735e}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.action{text-align:left;min-height:76px}.action small{display:block;font-size:11px;opacity:.78}.meta{font-size:12px;color:#758071;margin:12px 0;min-height:20px}#notice{font-size:13px;color:#875e3d;white-space:pre-wrap}#contact{width:100%;margin-top:14px;border-radius:9px;border:1px solid #ddd;image-rendering:auto}.legend{font-size:13px;background:#f0f3e9;padding:14px;border-radius:12px;margin-top:18px}details{margin-top:16px}pre{font-size:11px;max-height:240px;overflow:auto;background:#f2f1e9;padding:10px;white-space:pre-wrap}a{color:#507758}.step{width:100%;accent-color:#58735e;margin:14px 0}label{font-size:13px}#metrics{font-variant-numeric:tabular-nums}@media(max-width:850px){.layout{grid-template-columns:1fr}.panel{max-width:408px}.right{max-width:none}}@media(max-width:410px){main{padding:20px 8px}.panel{padding:10px}.stage{transform-origin:top left;max-width:100%}canvas{max-width:100%}}
</style>
<main><div class="eyebrow">CARTOON ANIMATOR · 一张图 / 多个动作</div><h1>让小宠物动起来</h1><p>分别看看姿势变化和位置运动。每个动作都有独立 JSON，可循环，也可只播放一次。</p>
<div class="layout"><section class="panel"><div class="stage checker" id="stage"><img id="fallback" src="__FIRST_FRAME__" alt="宠物动作初始帧" style="__FALLBACK_STYLE__"><canvas id="canvas" width="360" height="360" style="position:relative"></canvas></div>
<div class="controls"><button id="play" class="primary">暂停</button><button id="replay">重播</button><button id="reset">回到起点</button></div>
<input id="step" class="step" type="range" min="0" max="0" value="0" aria-label="逐帧查看">
<div class="controls"><label><input type="checkbox" id="motion" checked>位置运动</label><select id="background" aria-label="舞台背景"><option value="checker">透明检查</option><option value="warm">暖色背景</option><option value="dark">深色背景</option></select></div>
<div class="meta" id="metrics">正在读取素材…</div><div id="notice"></div></section>
<section class="panel right"><div class="actions" id="actions"></div><div class="legend" id="summary">正在加载动作清单…</div><img id="contact" alt="当前动作全部帧"><div class="meta">逐帧拼图保留真实透明边缘，播放速度来自动作 JSON。</div><details><summary>当前动作 JSON</summary><pre id="json"></pre><a id="download" download>下载该动作 JSON</a></details></section></div></main>
<script>
"use strict";
const $=id=>document.getElementById(id),ctx=$("canvas").getContext("2d");
const embedded=$("embedded-data")?JSON.parse($("embedded-data").textContent):null;
const statusNames={approved:"视觉验收通过",pending_visual_review:"待视觉验收",rejected:"候选 · 有待修正",extraction_failed:"提取失败"};
let pack,atlas,current,elapsed=0,last=0,playing=true,origin=[180,280],position=[180,280],frameIndex=0,manualFrame=null,visits=0;
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function limits(a,p){const [w,h]=pack.frame_size,[ax,ay]=a.anchor||[w/2,h];return [clamp(p[0],ax,360-w+ax),clamp(p[1],ay,360-h+ay)];}
function duration(a){const m=a.motion||{type:"none"};return $("motion").checked&&m.type!=="none"?m.duration_ms:a.frames.reduce((n,f)=>n+f.duration_ms,0);}
function offset(a,t){const m=a.motion||{type:"none"};if(!$("motion").checked||m.type==="none")return [0,0];let q=clamp(t/m.duration_ms,0,1);if(m.easing==="ease_in_out")q=q*q*(3-2*q);return [(m.dx||0)*q,(m.dy||0)*q-(m.type==="arc"?4*(m.height||0)*q*(1-q):0)];}
function frameAt(a,time){const total=a.frames.reduce((n,f)=>n+f.duration_ms,0);let t=a.loop?time%total:Math.min(time,total-.001);for(let i=0;i<a.frames.length;i++){if(t<a.frames[i].duration_ms)return i;t-=a.frames[i].duration_ms;}return a.frames.length-1;}
let downloadUrl=null;
function showDetails(){const a=pack.actions[current];$("json").textContent=JSON.stringify(a,null,2);if(downloadUrl)URL.revokeObjectURL(downloadUrl);const standalone=structuredClone(a);standalone.schema="pet-action/v1";standalone.sprite_sheet="../atlas.png";for(const f of standalone.frames)f.png="../"+f.png;downloadUrl=URL.createObjectURL(new Blob([JSON.stringify(standalone,null,2)],{type:"application/json"}));$("download").href=downloadUrl;$("download").download=current+".json";$("contact").src=embedded?.contacts[current]||"qa/"+current+"-contact.png";$("step").max=a.frames.length-1;$("notice").textContent=[a.review_note||"",...(a.warnings||[]),...(a.last_repair_failed||[])].join("\n");for(const b of $("actions").children)b.classList.toggle("active",b.dataset.action===current);}
function start(key,reset=false){const a=pack.actions[key];if(!a||!a.frames.length){playing=false;$("notice").textContent="动作没有可播放的帧："+key;return false;}if(reset)position=[180,280];current=key;origin=[...position];elapsed=0;manualFrame=null;playing=true;$("play").textContent="暂停";showDetails();draw();return true;}
function draw(){if(!current)return;const a=pack.actions[current],d=offset(a,elapsed);position=limits(a,[origin[0]+d[0],origin[1]+d[1]]);frameIndex=manualFrame===null?frameAt(a,elapsed):manualFrame;const f=a.frames[frameIndex],[ax,ay]=a.anchor||[f.w/2,f.h];ctx.clearRect(0,0,360,360);ctx.imageSmoothingEnabled=!pack.layout.pixel_art;ctx.drawImage(atlas,f.x,f.y,f.w,f.h,position[0]-ax,position[1]-ay,f.w,f.h);$("fallback").hidden=true;$("step").value=frameIndex;$("metrics").textContent=`${a.name} · 帧 ${frameIndex+1}/${a.frames.length} · 位置 ${position[0].toFixed(1)}, ${position[1].toFixed(1)}`;window.previewState={action:current,frame:frameIndex,position:[...position],elapsed,playing,visits,status:a.status};}
function tick(now){const dt=last?Math.min(now-last,100):0;last=now;if(current&&playing){const a=pack.actions[current];elapsed+=dt;const m=a.motion||{type:"none"},moves=$("motion").checked&&m.type!=="none";if(elapsed>=duration(a)&&(!a.loop||moves)){elapsed=duration(a);draw();if(moves&&m.finish==="return_origin")position=limits(a,origin);playing=false;visits++;if(a.next_action){const next=pack.actions[a.next_action];if(next&&next.frames.length)start(a.next_action);else $("notice").textContent="结束，但无法播放 next_action："+a.next_action;}else $("play").textContent="播放";}}draw();requestAnimationFrame(tick);}
$("play").onclick=()=>{if(!current)return;playing=!playing;manualFrame=null;$("play").textContent=playing?"暂停":"播放";};
$("replay").onclick=()=>{if(current){position=[...origin];start(current);}};
$("reset").onclick=()=>{if(current)start(current,true);};
$("motion").onchange=()=>{if(current){position=[...origin];start(current);}};
$("background").onchange=()=>{$("stage").className="stage "+$("background").value;};
$("step").oninput=()=>{if(!current)return;playing=false;$("play").textContent="播放";manualFrame=Number($("step").value);elapsed=pack.actions[current].frames.slice(0,manualFrame).reduce((n,f)=>n+f.duration_ms,0);draw();};
(async()=>{try{if(embedded)pack=embedded.pack;else{const response=await fetch("manifest.json");if(!response.ok)throw Error("manifest HTTP "+response.status);pack=await response.json();}atlas=new Image();atlas.src=embedded?.atlas||pack.sprite_sheet;await atlas.decode();for(const [key,a]of Object.entries(pack.actions)){const b=document.createElement("button");b.className="action";b.dataset.action=key;b.disabled=!a.frames.length;const title=document.createElement("span");title.textContent=a.name;const small=document.createElement("small");small.textContent=`${a.frames.length} 帧 · ${statusNames[a.status]||a.status}`;b.append(title,small);b.onclick=()=>start(key);$("actions").append(b);}const counts={};for(const a of Object.values(pack.actions))counts[a.status]=(counts[a.status]||0)+1;$("summary").textContent=Object.entries(counts).map(([k,n])=>`${statusNames[k]} ${n} 个`).join(" / ");const first=pack.actions.idle?.frames.length?"idle":Object.keys(pack.actions).find(k=>pack.actions[k].frames.length);if(first)start(first);else $("notice").textContent="全部动作提取失败，请查看 qa-report.json 和原图。";window.appReady=true;requestAnimationFrame(tick);}catch(error){$("notice").textContent="无法加载："+error.message+"。请通过 HTTP 打开预览。";window.appError=error.message;}})();
</script></html>
